<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tin Báo Mới</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        * { box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; }
        body { margin: 0; color: #f4f7ff; background: transparent; }
        .news { display: flex; min-height: 100%; height: 100%; flex-direction: column; padding: 14px; }
        .preview { display: block; width: 100%; min-height: 0; flex: 1; margin-bottom: 12px; border-radius: 10px; object-fit: contain; background: rgba(255, 255, 255, .08); }
        .label { margin: 0 0 8px; color: #46d9ff; font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
        .topics { display: flex; gap: 7px; margin-bottom: 10px; }
        .topic { padding: 4px 9px; border: 1px solid rgba(255, 255, 255, .18); border-radius: 20px; color: #9ba7c5; background: transparent; font: inherit; font-size: 10px; cursor: pointer; }
        .topic.active, .topic:hover { border-color: #46d9ff; color: #46d9ff; }
        .status { min-height: 14px; margin: 0 0 4px; color: #9ba7c5; font-size: 10px; }
        h1 { margin: 0; overflow: hidden; font-size: 15px; line-height: 1.35; white-space: nowrap; }
        h1 a { display: inline-block; min-width: 100%; padding-left: 100%; animation: headline-ticker 18s linear infinite; }
        h1 a { color: inherit; text-decoration: none; }
        h1 a:hover { color: #46d9ff; }
        @keyframes headline-ticker {
            from { transform: translateX(0); }
            to { transform: translateX(-100%); }
        }
    </style>
</head>
<body>
    <main class="news">
        <div class="topics" aria-label="Chọn nhóm tin">
            <button class="topic active" type="button" data-topic="hot">Nóng</button>
            <button class="topic" type="button" data-topic="latest">Mới</button>
        </div>
        <img class="preview" id="preview" src="" alt="Ảnh preview tin tức">
        <p class="status" id="status" role="status" aria-live="polite"></p>
        <h1><a id="headline" href="https://baomoi.com/ca-nuoc-xuat-hien-mua-dong-bien-dong-co-kha-nang-xuat-hien-ap-thap-nhiet-doi-c56020656.epi" target="_blank" rel="noopener">Cả nước xuất hiện mưa dông, Biển Đông có khả năng xuất hiện áp thấp nhiệt đới</a></h1>
    </main>

    <script>
        const fallbackArticles = [
            {
                topic: "hot",
                title: "Cả nước xuất hiện mưa dông, Biển Đông có khả năng xuất hiện áp thấp nhiệt đới",
                url: "https://baomoi.com/ca-nuoc-xuat-hien-mua-dong-bien-dong-co-kha-nang-xuat-hien-ap-thap-nhiet-doi-c56020656.epi",
                image: "https://photo-baomoi.bmcdn.me/w700_r16x9/2026_09_10_294_56020656/e575fa5eb3155a4b0304.jpg"
            },
            {
                topic: "hot",
                title: "U23 Việt Nam đặt mục tiêu vào tứ kết Asiad, bất ngờ gặp khó",
                url: "https://baomoi.com/u23-viet-nam-dat-muc-tieu-vao-tu-ket-asiad-bat-ngo-gap-kho-c56020949.epi",
                image: "https://photo-baomoi.bmcdn.me/w500_r3x2/2026_09_10_23_56020949/f3d7b95f0114e84ab105.jpg"
            },
            {
                topic: "hot",
                title: "Ông Trump đề xuất trả 5.000 USD cho mỗi cử tri Mỹ nếu Đảng Cộng hòa thắng cử",
                url: "https://baomoi.com/ong-trump-de-xuat-tra-5-000-usd-cho-moi-cu-tri-my-neu-dang-cong-hoa-thang-cu-c56020879.epi",
                image: "https://photo-baomoi.bmcdn.me/w500_r3x2/2026_09_10_197_56020879/62d9e7565f1db643ef0c.jpg"
            },
            {
                topic: "latest",
                title: "Tin tức mới nhất từ Báo Mới",
                url: "https://baomoi.com/",
                image: ""
            }
        ];

        let articles = fallbackArticles;
        let currentTopic = "hot";
        let currentIndex = 0;
        const headline = document.getElementById("headline");
        const preview = document.getElementById("preview");
        const status = document.getElementById("status");
        const topicButtons = document.querySelectorAll(".topic");

        function showArticle() {
            const topicArticles = articles.filter((article) => article.topic === currentTopic);
            const article = topicArticles[currentIndex % topicArticles.length];
            headline.textContent = article.title;
            headline.href = article.url;
            headline.title = `Mở bài: ${article.title}`;
            preview.alt = `Ảnh preview: ${article.title}`;
            if (article.image) {
                preview.src = article.image;
            } else {
                preview.removeAttribute("src");
            }
            currentIndex = (currentIndex + 1) % topicArticles.length;
        }

        function parseArticles(markup) {
            const documentFragment = new DOMParser().parseFromString(markup, "text/html");
            const seen = new Set();
            const parsed = [];
            documentFragment.querySelectorAll('a[href*="-c"][href$=".epi"]').forEach(function (link) {
                const url = new URL(link.getAttribute("href"), "https://baomoi.com").href;
                if (!/-c\d+\.epi$/i.test(new URL(url).pathname)) {
                    return;
                }
                const title = (link.getAttribute("title") || link.textContent || "").replace(/\s+/g, " ").trim();
                const card = link.closest(".bm-card");
                const image = card && card.querySelector("img[src^='https://']");
                if (!title || seen.has(url) || !image) {
                    return;
                }
                seen.add(url);
                parsed.push({
                    topic: parsed.length < 3 ? "hot" : "latest",
                    title: title,
                    url: url,
                    image: image.src
                });
            });
            if (parsed.length < 3) {
                throw new Error("Bao Moi không trả về đủ tin mới.");
            }
            return parsed;
        }

        async function refreshArticles() {
            try {
                const response = await fetch("https://baomoi.com/", { cache: "no-store" });
                if (!response.ok) {
                    throw new Error(`Bao Moi trả về HTTP ${response.status}.`);
                }
                const latestArticles = parseArticles(await response.text());
                articles = latestArticles;
                currentIndex = 0;
                localStorage.setItem("baomoi-articles", JSON.stringify(latestArticles));
                status.textContent = `Đã cập nhật ${latestArticles.length} tin mới từ Báo Mới`;
                showArticle();
            } catch (error) {
                status.textContent = "Chưa thể cập nhật tin mới, đang hiển thị dữ liệu gần nhất.";
                console.warn("Không thể cập nhật tin Báo Mới:", error);
            }
        }

        topicButtons.forEach(function (button) {
            button.addEventListener("click", function () {
                currentTopic = button.dataset.topic;
                currentIndex = 0;
                topicButtons.forEach((item) => item.classList.toggle("active", item === button));
                showArticle();
            });
        });

        preview.addEventListener("error", function () {
            preview.removeAttribute("src");
            preview.alt = "Không tải được ảnh preview của bài báo";
        });

        showArticle();
        const cachedArticles = localStorage.getItem("baomoi-articles");
        if (cachedArticles) {
            try {
                const parsedCache = JSON.parse(cachedArticles);
                if (Array.isArray(parsedCache) && parsedCache.length >= 3) {
                    articles = parsedCache;
                    status.textContent = "Đang dùng tin đã lưu, chờ cập nhật...";
                    showArticle();
                }
            } catch (error) {
                localStorage.removeItem("baomoi-articles");
                console.warn("Dữ liệu tin đã lưu không hợp lệ:", error);
            }
        }
        refreshArticles();
        window.setInterval(showArticle, 60 * 1000);
        window.setInterval(refreshArticles, 5 * 60 * 1000);
    </script>
</body>
</html>
